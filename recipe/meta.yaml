{% set name = "pybtexris" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pybtexris-{{ version }}.tar.gz
  sha256: 8b55aecb7a2370bb98b592befffc776e8d2d05ad62b8754dfa23070cb2d87c4f

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python >=3.7,<4.0
    - poetry-core >=1.0.0
    - pip
  run:
    - python >=3.7.1,<4.0.0
    - pybtex >=0.24.0,<0.25.0

test:
  imports:
    - pybtexris
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/rbturnbull/pybtexris
  summary: A pybtex plugin for working with RIS files.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rbturnbull
    - vinisalazar
